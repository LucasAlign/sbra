name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Disposable Postgres for the integration suite. Fresh per job run, so the
    # fixed-id fixtures always start clean.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COLLAB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collab_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm run test:network
      - name: Integration tests (disposable Postgres)
        run: npm run test:network:integration
